<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BILLKIN WALKIN' TO 27 - Twibbon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <div class="brand">
      <div class="logo-text">BK</div>
      <span>BILLKIN WALKIN' TO 27</span>
    </div>

    <div class="music-player">
      <button id="musicToggle" class="music-btn">🎵 Play Music</button>
      <audio id="bgm" src="Audio/bgm.mp3" loop></audio>
    </div>
  </header>

  <main class="layout">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
      </div>
      <p class="hint" id="hint" hidden>Geser, pinch, atau scroll untuk mengatur posisi & zoom foto.</p>
    </div>

    <div class="panel">
      <section class="step">
        <h2><span>1</span> Pilih Foto</h2>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <button class="btn primary" id="pickPhoto">Unggah Foto Kamu</button>
      </section>

      <section class="step">
        <h2><span>2</span> Sesuaikan Posisi</h2>
        
        <div class="range">
          <span>Zoom</span>
          <input type="range" id="zoom" min="0.1" max="5" step="0.01" value="1" disabled>
          <output id="zoomOut">100%</output>
        </div>
        <div class="row">
          <button class="btn small" id="zoomOutBtn" disabled>-</button>
          <button class="btn small wide" id="resetBtn" disabled>Reset Posisi</button>
          <button class="btn small" id="zoomInBtn" disabled>+</button>
        </div>

        <div class="range" style="margin-top: 14px;">
          <span>Rotasi</span>
          <input type="range" id="rotate" min="-180" max="180" step="1" value="0" disabled>
          <output id="rotateOut">0°</output>
        </div>
      </section>

      <section class="step">
        <h2><span>3</span> Unduh Hasil</h2>
        <button class="btn primary" id="download" disabled>Download Twibbon</button>
        
        <a href="https://www.instagram.com/bbillkin/" target="_blank" rel="noopener noreferrer" class="ig-link-inline">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          <span>@bbillkin</span>
        </a>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
