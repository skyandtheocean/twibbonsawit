<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bingkaiku — Pasang Foto ke Twibbon</title>
  <meta name="description" content="Pasang fotomu ke twibbon, geser, zoom, putar, lalu unduh dalam sekejap. Semua diproses di perangkatmu." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23e81d5d' stroke-width='16'/></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Bingkaiku</div>
    <p class="tag">Foto kamu tidak pernah diunggah ke server.</p>
  </header>

  <main class="layout">
    <section class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="canvas" width="1080" height="1080" aria-label="Pratinjau twibbon"></canvas>
        <label class="empty" id="empty" for="photoInput">
          <span class="plus" aria-hidden="true">+</span>
          <strong>Pilih foto kamu</strong>
          <small>atau seret &amp; lepas gambar ke sini</small>
        </label>
      </div>
      <p class="hint" id="hint" hidden>Geser untuk memindahkan · Cubit atau scroll untuk zoom</p>
    </section>

    <aside class="panel">
      <div class="step">
        <h2><span>1</span> Foto</h2>
        <input type="file" id="photoInput" accept="image/*" hidden />
        <button class="btn ghost" id="pickPhoto">Ganti foto</button>
      </div>

      <div class="step">
        <h2><span>2</span> Atur posisi</h2>
        <label class="range">
          <span>Zoom</span>
          <input type="range" id="zoom" min="0.1" max="5" step="0.01" value="1" disabled />
          <output id="zoomOut">100%</output>
        </label>
        <label class="range">
          <span>Putar</span>
          <input type="range" id="rotate" min="-180" max="180" step="1" value="0" disabled />
          <output id="rotateOut">0°</output>
        </label>
        <div class="row">
          <button class="btn small" id="zoomOutBtn" disabled aria-label="Perkecil">−</button>
          <button class="btn small" id="zoomInBtn" disabled aria-label="Perbesar">+</button>
          <button class="btn small wide" id="resetBtn" disabled>Reset posisi</button>
        </div>
      </div>

      <button class="btn primary" id="download" disabled>Unduh foto twibbon</button>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
