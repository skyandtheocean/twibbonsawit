<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billkin Walkin' To 27 - Twibbon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <div class="brand">
      <div class="logo-text">BK</div>
      <span>Billkin Walkin' To 27</span>
    </div>
  </header>

  <main class="layout">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="empty" id="empty">
          <div class="plus">+</div>
          <strong>Pilih foto kamu</strong>
          <small>atau seret & lepas gambar ke sini</small>
        </div>
      </div>
      <p class="hint" id="hint" hidden>Geser, cubit (pinch), atau *scroll* mouse untuk mengatur posisi & zoom foto.</p>
    </div>

    <div class="panel">
      <!-- Step 1: Upload Foto -->
      <section class="step">
        <h2><span>1</span> Pilih Foto</h2>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <button class="btn primary" id="pickPhoto">Unggah Foto Kamu</button>
      </section>

      <!-- Step 2: Atur Posisi -->
      <section class="step">
        <h2><span>2</span> Sesuaikan Posisi</h2>
        
        <div class="range">
          <span>Zoom</span>
          <input type="range" id="zoom" min="0.1" max="5" step="0.01" value="1" disabled>
          <output id="zoomOut">100%</output>
        </div>
        <div class="row">
          <button class="btn small" id="zoomOutBtn" disabled>-</button>
          <button class="btn small wide" id="resetBtn" disabled>Reset Posisi</button>
          <button class="btn small" id="zoomInBtn" disabled>+</button>
        </div>

        <div class="range" style="margin-top: 14px;">
          <span>Rotasi</span>
          <input type="range" id="rotate" min="-180" max="180" step="1" value="0" disabled>
          <output id="rotateOut">0°</output>
        </div>
      </section>

      <!-- Step 3: Download -->
      <section class="step">
        <h2><span>3</span> Unduh Hasil</h2>
        <button class="btn primary" id="download" disabled>Download Twibbon</button>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
